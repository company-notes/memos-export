; Manage Memos without stopping the Docker container (Memos v0.31.0).
; Supervisor stays PID 1; original entrypoint still fixes volume permissions and
; drops privileges to MEMOS_UID/MEMOS_GID before exec'ing the server.

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:memos]
command=/usr/local/memos/entrypoint.sh /usr/local/memos/memos
directory=/var/opt/memos
autostart=true
autorestart=unexpected
startsecs=3
startretries=3
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
